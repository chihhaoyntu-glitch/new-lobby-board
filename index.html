<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程教室公告看板 (步驟4：Banners 時段自動開關)</title>
    <style>
        /* --- 基礎鎖定與重置 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background-color: #dceefc;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.45) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.45) 2px, transparent 2px);
            background-size: 36px 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 1080x730 外框與等比縮放 --- */
        .signage-scale-wrapper {
            width: 1080px;
            height: 730px;
            position: relative;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
        }

        .signage-container {
            width: 1080px;
            height: 730px;
            margin: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            position: relative;
        }

        /* --- 頂部 Header --- */
        .header-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border: 3.5px solid #334155;
            border-radius: 20px;
            padding: 10px 16px;
            margin-bottom: 8px;
            box-shadow: 0px 6px 0px rgba(51, 65, 85, 0.15), 0px 12px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .header-bar.is-hidden {
            display: none !important;
        }

        .header-row1 {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title-box {
            display: flex;
            align-items: center;
        }

        .icon-badge {
            background-color: #ffe885;
            border: 2.5px solid #334155;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0px 3px 0px rgba(0, 0, 0, 0.12);
        }

        .board-title {
            font-size: 24px;
            font-weight: 900;
            color: #1e293b;
            letter-spacing: 1px;
        }

        .clock-container {
            display: flex;
            align-items: center;
            margin-left: 8px;
            padding-left: 12px;
            border-left: 2px solid #cbd5e1;
            font-size: 14px;
            font-weight: 800;
            color: #1e1b4b;
            background-color: #e0e7ff;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid #c7d2fe;
        }

        .header-row2 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 4px;
            border-top: 1px solid #e2e8f0;
        }

        .day-selector {
            display: flex;
            align-items: center;
            background-color: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
        }

        .day-btn {
            border: none;
            background: transparent;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 900;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .day-btn.active {
            background-color: #4f46e5;
            color: #ffffff;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.1);
        }

        .day-btn.today {
            background-color: #fef3c7;
            color: #78350f;
            border: 1px solid #fde68a;
        }

        .today-badge {
            font-size: 10px;
            background-color: #fbbf24;
            color: #0f172a;
            padding: 1px 4px;
            border-radius: 4px;
        }

        .page-badge {
            display: flex;
            align-items: center;
            background-color: #fef3c7;
            border: 2.5px solid #fbbf24;
            color: #78350f;
            font-weight: 900;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .page-btn {
            background: transparent;
            border: none;
            font-weight: 900;
            color: #78350f;
            cursor: pointer;
            padding: 0 4px;
        }

        /* --- 4 個卡片欄位 (水彩風格) --- */
        .card-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            margin: auto 0;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .watercolor-card {
            position: relative;
            border: 3.5px solid #334155;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            box-shadow: 0px 6px 0px rgba(51, 65, 85, 0.15), 0px 10px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            height: 110px;
            animation: cardFadeIn 0.5s ease forwards;
            transition: height 0.3s ease, padding 0.3s ease;
        }

        .card-container.expand-mode .watercolor-card {
            height: 132px;
            padding: 14px 24px;
        }

        .card-container.expand-mode .time-text { font-size: 26px; }
        .card-container.expand-mode .course-name { font-size: 30px; }
        .card-container.expand-mode .teacher-name { font-size: 20px; }
        .card-container.expand-mode .room-badge { font-size: 26px; padding: 10px 22px; }

        .watercolor-card:nth-child(1) { animation-delay: 0.05s; }
        .watercolor-card:nth-child(2) { animation-delay: 0.12s; }
        .watercolor-card:nth-child(3) { animation-delay: 0.19s; }
        .watercolor-card:nth-child(4) { animation-delay: 0.26s; }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-cardMint { background-color: #a2e3c4; }
        .bg-cardBlue { background-color: #b3e0ff; }
        .bg-cardYellow { background-color: #ffe885; }
        .bg-cardRed { background-color: #ff9e9e; }

        .time-box {
            width: 180px;
            background: rgba(255, 255, 255, 0.92);
            border: 2.5px solid #334155;
            border-radius: 14px;
            padding: 6px 0;
            text-align: center;
            flex-shrink: 0;
        }

        .time-text {
            font-size: 22px;
            font-weight: 900;
            color: #0f172a;
            display: block;
        }

        .status-pill {
            display: inline-block;
            margin-top: 2px;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 900;
            background-color: #e2e8f0;
            color: #334155;
        }

        .status-live {
            background-color: #10b981;
            color: #ffffff;
            animation: pulse-live 1.8s infinite ease-in-out;
        }

        @keyframes pulse-live {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }

        .info-box {
            flex: 1;
            margin-left: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 0;
        }

        .course-details {
            flex: 1;
            min-width: 0;
            margin-right: 16px;
        }

        .course-name {
            font-size: 26px;
            font-weight: 900;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .teacher-name {
            display: flex;
            align-items: center;
            margin-top: 4px;
            font-size: 17px;
            font-weight: 800;
            color: #334155;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .room-badge {
            background-color: #1e293b;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 12px;
            border: 3.5px solid #334155;
            font-size: 22px;
            font-weight: 900;
            box-shadow: 0px 4px 0px rgba(0, 0, 0, 0.12);
            flex-shrink: 0;
            display: flex;
            align-items: center;
        }

        /* --- 招生圖片輪播容器 --- */
        .banner-display-container {
            width: 100%;
            flex: 1;
            display: none;
            border: 3.5px solid #334155;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background-color: #ffffff;
            box-shadow: 0px 6px 0px rgba(51, 65, 85, 0.15);
            margin: auto 0;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- 跑馬燈公告 --- */
        .footer-bar {
            width: 100%;
            background-color: #fef3c7;
            border: 2.5px solid #334155;
            border-radius: 14px;
            padding: 8px 16px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            box-shadow: 0px 3px 0px rgba(0, 0, 0, 0.08);
            flex-shrink: 0;
        }

        .marquee-label {
            background-color: #fbbf24;
            color: #1e293b;
            font-size: 13px;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 8px;
            border: 1.5px solid #334155;
            flex-shrink: 0;
        }

        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            flex: 1;
        }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            font-size: 18px;
            font-weight: 900;
            color: #1e293b;
            animation: marquee-anim 20s linear infinite;
        }

        @keyframes marquee-anim {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Android 5.1 舊版 WebView 相容：以 margin 取代 flex gap */
        .header-bar > * + * { margin-top: 6px; }
        .header-title-box > * + * { margin-left: 12px; }
        .clock-container > * + * { margin-left: 6px; }
        .day-btn + .day-btn { margin-left: 6px; }
        .day-btn > * + * { margin-left: 4px; }
        .page-badge > * + * { margin-left: 6px; }
        .card-container > * + * { margin-top: 10px; }
        .teacher-name > * + * { margin-left: 6px; }
        .room-badge > * + * { margin-left: 6px; }
        .footer-bar > * + * { margin-left: 12px; }

        /* 不支援 object-fit 的舊版 WebView 仍以固定容器顯示圖片 */
        .banner-img { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>

    <div id="scaleWrapper" class="signage-scale-wrapper">
        <div class="signage-container">

            <!-- HEADER BAR -->
            <header id="mainHeader" class="header-bar">
                <div class="header-row1">
                    <div class="header-title-box">
                        <div class="icon-badge">📢</div>
                        <h1 id="boardTitle" class="board-title">課程教室公告</h1>
                        <div id="topClockContainer" class="clock-container">
                            <span>⏰</span>
                            <span id="topClockText">加載中...</span>
                        </div>
                    </div>
                </div>

                <div class="header-row2">
                    <div id="daySelector" class="day-selector"></div>

                    <div id="pageBadge" class="page-badge" style="display: none;">
                        <button onclick="prevPage()" class="page-btn">◀</button>
                        <span id="pageText">頁次 1 / 1</span>
                        <button onclick="nextPage()" class="page-btn">▶</button>
                    </div>
                </div>
            </header>

            <!-- MAIN DISPLAY: 4 CARDS (課表區塊) -->
            <main id="cardContainer" class="card-container">
                <div id="card-0" class="watercolor-card bg-cardMint">
                    <div class="time-box">

                    </div>
                    <div class="info-box">
                        <div class="course-details">
                            <div id="name-0" class="course-name">--</div>
                            <div class="teacher-name"><span>👤</span><span id="teacher-0">--</span></div>
                        </div>
                        <div class="room-badge">🏫 <span id="room-0">--</span></div>
                    </div>
                </div>

                <div id="card-1" class="watercolor-card bg-cardBlue">
                    <div class="time-box">
                        <span id="time-1" class="time-text">00:00 - 00:00</span>
                        <span id="status-1" class="status-pill">計算中</span>
                    </div>
                    <div class="info-box">
                        <div class="course-details">
                            <div id="name-1" class="course-name">--</div>
                            <div class="teacher-name"><span>👤</span><span id="teacher-1">--</span></div>
                        </div>
                        <div class="room-badge">🏫 <span id="room-1">--</span></div>
                    </div>
                </div>

                <div id="card-2" class="watercolor-card bg-cardYellow">
                    <div class="time-box">
                        <span id="time-2" class="time-text">00:00 - 00:00</span>
                        <span id="status-2" class="status-pill">計算中</span>
                    </div>
                    <div class="info-box">
                        <div class="course-details">
                            <div id="name-2" class="course-name">--</div>
                            <div class="teacher-name"><span>👤</span><span id="teacher-2">--</span></div>
                        </div>
                        <div class="room-badge">🏫 <span id="room-2">--</span></div>
                    </div>
                </div>

                <div id="card-3" class="watercolor-card bg-cardRed">
                    <div class="time-box">
                        <span id="time-3" class="time-text">00:00 - 00:00</span>
                        <span id="status-3" class="status-pill">計算中</span>
                    </div>
                    <div class="info-box">
                        <div class="course-details">
                            <div id="name-3" class="course-name">--</div>
                            <div class="teacher-name"><span>👤</span><span id="teacher-3">--</span></div>
                        </div>
                        <div class="room-badge">🏫 <span id="room-3">--</span></div>
                    </div>
                </div>
            </main>

            <!-- BANNERS DISPLAY (招生圖片輪播區塊) -->
            <div id="bannerContainer" class="banner-display-container">
                <img id="bannerImg" class="banner-img" src="" alt="招生海報">
            </div>

            <!-- FOOTER MARQUEE -->
            <footer class="footer-bar">
                <span class="marquee-label">📢 公告</span>
                <div class="marquee-container">
                    <div id="marqueeText" class="marquee-track">載入中，請稍候...</div>
                </div>
            </footer>

        </div>
    </div>

    <!-- APP LOGIC -->
    <script>
        var COURSES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkOoAr-xdQSYp8U6yyedy5uUypUlQVQiPSiVzLd8lAEmfQacXXY2g8hNEjcmeObgxRcguKX7xsr34V/pub?gid=0&single=true&output=csv";
        var CONFIG_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkOoAr-xdQSYp8U6yyedy5uUypUlQVQiPSiVzLd8lAEmfQacXXY2g8hNEjcmeObgxRcguKX7xsr34V/pub?gid=962273106&single=true&output=csv";
        var BANNERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkOoAr-xdQSYp8U6yyedy5uUypUlQVQiPSiVzLd8lAEmfQacXXY2g8hNEjcmeObgxRcguKX7xsr34V/pub?gid=1617619420&single=true&output=csv";

        var DAYS = [
            { id: 1, name: '一' }, { id: 2, name: '二' }, { id: 3, name: '三' },
            { id: 4, name: '四' }, { id: 5, name: '五' }, { id: 6, name: '六' }, { id: 0, name: '日' }
        ];

        let currentSchedule = { 0:[], 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] };
        let bannerList = [];
        let currentBannerIndex = 0;
        
        let activeDay = new Date().getDay();
        let currentPage = 0;
        let mainTimer = null;
        
        let boardTitle = "課程教室公告";
        let marqueeText = "歡迎蒞臨！請全程佩戴口罩並保持社交距離。";
        let carouselIntervalSec = 8;
        let bannerIntervalSec = 10;
        let showHeader = true;

        // 步驟 1 & 2：課表總開關與時段
        let enableCourses = true;
        let courseStartTime = "";
        let courseEndTime = "";

        // 步驟 3：Banners 總開關
        let enableBanners = true;

        // 【步驟 4 新增】：Banners 時段設定變數
        let bannerStartTime = "";
        let bannerEndTime = "";

        var dataLoading = false;
        var currentDisplayMode = 'board';
        var currentBannerSourceIndex = -1;
        var currentBannerUrl = '';
        var lastRealDay = new Date().getDay();
        var ruleCheckTimer = null;

        function buildFreshUrl(url) {
            if (!url) return '';
            var timestamp = new Date().getTime();
            return url + (url.indexOf('?') !== -1 ? '&_cb=' : '?_cb=') + timestamp;
        }

        // 標準 CSV 解析：支援引號、欄位內逗號、雙引號、跨行文字及 CRLF。
        function parseCSV(text) {
            if (!text) return [];
            text = String(text).replace(/^\uFEFF/, '');
            var rows = [], row = [], field = '', inQuotes = false;
            for (var i = 0; i < text.length; i++) {
                var ch = text.charAt(i);
                if (inQuotes) {
                    if (ch === '"') {
                        if (text.charAt(i + 1) === '"') { field += '"'; i++; }
                        else { inQuotes = false; }
                    } else { field += ch; }
                } else if (ch === '"' && field.length === 0) {
                    inQuotes = true;
                } else if (ch === ',') {
                    row.push(field); field = '';
                } else if (ch === '\n' || ch === '\r') {
                    if (ch === '\r' && text.charAt(i + 1) === '\n') i++;
                    row.push(field); field = '';
                    if (row.length > 1 || row[0] !== '') rows.push(row);
                    row = [];
                } else { field += ch; }
            }
            if (field.length || row.length) { row.push(field); rows.push(row); }
            if (!rows.length) return [];
            var headers = rows.shift();
            for (var h = 0; h < headers.length; h++) headers[h] = String(headers[h]).trim();
            var result = [];
            for (var r = 0; r < rows.length; r++) {
                var obj = {};
                for (var c = 0; c < headers.length; c++) obj[headers[c]] = rows[r][c] === undefined ? '' : String(rows[r][c]).trim();
                result.push(obj);
            }
            return result;
        }

        function requestCSV(url, callback) {
            if (!url) { callback(null); return; }
            var xhr = new XMLHttpRequest();
            var completed = false;
            var timeoutId = setTimeout(function() { finish(null); }, 15000);
            function finish(data) {
                if (completed) return;
                completed = true;
                clearTimeout(timeoutId);
                callback(data);
            }
            try {
                xhr.open('GET', buildFreshUrl(url), true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200 || xhr.status === 0) finish(xhr.responseText);
                        else finish(null);
                    }
                };
                xhr.onerror = function() { finish(null); };
                xhr.send();
            } catch (e) { finish(null); }
        }

        function applyHeaderVisibility(visible) {
            var headerElem = document.getElementById('mainHeader');
            var cardContainer = document.getElementById('cardContainer');
            if (visible) {
                headerElem.classList.remove('is-hidden');
                cardContainer.classList.remove('expand-mode');
            } else {
                headerElem.classList.add('is-hidden');
                cardContainer.classList.add('expand-mode');
            }
        }

        function convertDriveUrl(url) {
            if (!url) return '';
            var match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) return 'https://drive.google.com/uc?export=view&id=' + match[1];
            return url;
        }

        function parseMinutes(timeStr) {
            if (!timeStr || typeof timeStr !== 'string') return -1;
            var match = timeStr.trim().match(/^(\d{1,2}):(\d{2})$/);
            if (!match) return -1;
            var h = parseInt(match[1], 10), m = parseInt(match[2], 10);
            if (h < 0 || h > 23 || m < 0 || m > 59) return -1;
            return h * 60 + m;
        }

        function isTimeRangeActive(startStr, endStr, now, allowSingleBound) {
            var startMins = parseMinutes(startStr), endMins = parseMinutes(endStr);
            var clockNow = now || new Date();
            var currentMins = clockNow.getHours() * 60 + clockNow.getMinutes();
            // 全域設定沿用舊規則；單張 Banner 則允許只設定開始或結束時間。
            if (startMins === -1 || endMins === -1) {
                if (!allowSingleBound) return true;
                if (startMins !== -1) return currentMins >= startMins;
                if (endMins !== -1) return currentMins < endMins;
                return true;
            }
            if (startMins === endMins) return false;
            if (startMins < endMins) return currentMins >= startMins && currentMins < endMins;
            return currentMins >= startMins || currentMins < endMins;
        }

        function isCourseTimeActive() { return isTimeRangeActive(courseStartTime, courseEndTime, new Date()); }
        function isBannerTimeActive() { return isTimeRangeActive(bannerStartTime, bannerEndTime, new Date()); }

        function normalizeDateKey(value) {
            if (!value) return '';
            var v = String(value).trim();
            var m = v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
            var y, mo, d;
            if (m) { y = parseInt(m[1], 10); mo = parseInt(m[2], 10); d = parseInt(m[3], 10); }
            else {
                m = v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
                if (!m) return '';
                y = parseInt(m[3], 10); mo = parseInt(m[1], 10); d = parseInt(m[2], 10);
            }
            if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
            var checkDate = new Date(y, mo - 1, d);
            if (checkDate.getFullYear() !== y || checkDate.getMonth() !== mo - 1 || checkDate.getDate() !== d) return '';
            return y * 10000 + mo * 100 + d;
        }

        function isBannerItemActive(item, now) {
            now = now || new Date();
            var todayKey = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
            var startDate = normalizeDateKey(item.startDate);
            var endDate = normalizeDateKey(item.endDate);
            if (startDate && todayKey < startDate) return false;
            if (endDate && todayKey > endDate) return false;
            if (!isTimeRangeActive(item.startTime, item.endTime, now, true)) return false;
            if (item.daysOfWeek) {
                var dayText = String(item.daysOfWeek).trim();
                if (dayText && dayText !== '*' && dayText.toLowerCase() !== 'all') {
                    var allowed = dayText.split(/[;,\s]+/);
                    var today = String(now.getDay());
                    if (allowed.indexOf(today) === -1) return false;
                }
            }
            return true;
        }

        function getEligibleBanners() {
            var now = new Date(), eligible = [];
            if (!enableBanners || !isBannerTimeActive()) return eligible;
            for (var i = 0; i < bannerList.length; i++) {
                if (isBannerItemActive(bannerList[i], now)) eligible.push({ item: bannerList[i], sourceIndex: i });
            }
            return eligible;
        }

        function fetchAllData() {
            if (dataLoading) return;
            dataLoading = true;
            var remaining = 3;
            function finishBatch() {
                remaining--;
                if (remaining > 0) return;
                dataLoading = false;
                renderDaySelector();
                document.getElementById('boardTitle').innerText = boardTitle;
                document.getElementById('marqueeText').innerText = marqueeText;
                applyHeaderVisibility(showHeader);
                syncAfterDataRefresh();
            }

            requestCSV(CONFIG_CSV_URL, function(response) {
                if (response !== null) {
                    var configData = parseCSV(response);
                    for (var i = 0; i < configData.length; i++) {
                        var row = configData[i], k = row.Key ? row.Key.trim() : '', v = row.Value === undefined ? '' : row.Value.trim();
                        if (k === 'boardTitle') boardTitle = v;
                        if (k === 'marqueeText') marqueeText = v;
                        if (k === 'carouselIntervalSec') carouselIntervalSec = validSeconds(v, 8);
                        if (k === 'bannerIntervalSec') bannerIntervalSec = validSeconds(v, 10);
                        if (k === 'showHeader') showHeader = String(v).toLowerCase() !== 'false';
                        if (k === 'enableCourses') enableCourses = String(v).toLowerCase() !== 'false';
                        if (k === 'courseStartTime') courseStartTime = v;
                        if (k === 'courseEndTime') courseEndTime = v;
                        if (k === 'enableBanners') enableBanners = String(v).toLowerCase() !== 'false';
                        if (k === 'bannerStartTime') bannerStartTime = v;
                        if (k === 'bannerEndTime') bannerEndTime = v;
                    }
                }
                finishBatch();
            });

            requestCSV(BANNERS_CSV_URL, function(response) {
                if (response !== null) {
                    var rows = parseCSV(response), newBanners = [];
                    for (var i = 0; i < rows.length; i++) {
                        var item = rows[i];
                        if (item.ImageUrl && item.ImageUrl.trim()) {
                            var duration = parseInt(item.DurationSec, 10);
                            newBanners.push({
                                url: convertDriveUrl(item.ImageUrl.trim()),
                                duration: (!isNaN(duration) && duration > 0) ? duration : 0,
                                startDate: item.StartDate || '', endDate: item.EndDate || '',
                                startTime: item.StartTime || '', endTime: item.EndTime || '',
                                daysOfWeek: item.DaysOfWeek || ''
                            });
                        }
                    }
                    bannerList = newBanners;
                    if (currentBannerIndex >= bannerList.length) currentBannerIndex = 0;
                }
                finishBatch();
            });

            requestCSV(COURSES_CSV_URL, function(response) {
                if (response !== null) {
                    var rows = parseCSV(response);
                    var newSchedule = { 0:[], 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] };
                    for (var i = 0; i < rows.length; i++) {
                        var item = rows[i], day = parseInt(item.Day, 10);
                        if (!isNaN(day) && day >= 0 && day <= 6) {
                            newSchedule[day].push({ startTime:item.StartTime, endTime:item.EndTime, name:item.Name, teacher:item.Teacher, room:item.Room });
                        }
                    }
                    currentSchedule = newSchedule;
                }
                finishBatch();
            });
        }

        function validSeconds(value, fallback) {
            var n = parseInt(value, 10);
            return (!isNaN(n) && n > 0) ? n : fallback;
        }

        function evaluateCourseStatus(startStr, endStr) {
            var startMins = parseMinutes(startStr), endMins = parseMinutes(endStr);
            if (startMins === -1 || endMins === -1) return { text:'未開始', class:'' };
            var now = new Date(), currentMins = now.getHours() * 60 + now.getMinutes();
            var active = startMins === endMins ? false : (startMins < endMins ? (currentMins >= startMins && currentMins < endMins) : (currentMins >= startMins || currentMins < endMins));
            if (active) return { text:'● 進行中', class:'status-live' };
            var untilStart = startMins - currentMins;
            if (untilStart < 0) untilStart += 1440;
            if (untilStart > 0 && untilStart <= 30) return { text:'即將開始', class:'' };
            if (startMins < endMins && currentMins >= endMins) return { text:'已結束', class:'' };
            if (startMins > endMins && currentMins >= endMins && currentMins < startMins) return { text:'已結束', class:'' };
            return { text:'未開始', class:'' };
        }

        function updateTopClock() {
            var now = new Date();
            var year = now.getFullYear();
            var month = (now.getMonth() + 1 < 10 ? '0' : '') + (now.getMonth() + 1);
            var date = (now.getDate() < 10 ? '0' : '') + now.getDate();
            var dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            var dayStr = dayNames[now.getDay()];
            var hours = (now.getHours() < 10 ? '0' : '') + now.getHours();
            var mins = (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
            var secs = (now.getSeconds() < 10 ? '0' : '') + now.getSeconds();
            document.getElementById('topClockText').innerText = year + '/' + month + '/' + date + ' (' + dayStr + ') ' + hours + ':' + mins + ':' + secs;
        }

        function renderDaySelector() {
            var container = document.getElementById('daySelector');
            container.innerHTML = '';
            var realToday = new Date().getDay();
            DAYS.forEach(function(day) {
                var isSelected = activeDay === day.id;
                var isToday = realToday === day.id;
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'day-btn' + (isSelected ? ' active' : '') + (isToday && !isSelected ? ' today' : '');
                var dayLabel = '週' + day.name;
                if (isToday) dayLabel += ' <span class="today-badge">今日</span>';
                btn.innerHTML = dayLabel;
                btn.onclick = function() { activeDay = day.id; currentPage = 0; currentBannerIndex = 0; renderDaySelector(); routeDisplay(); };
                container.appendChild(btn);
            });
        }

        // 資料定時更新後，若目前 Banner 仍符合條件且圖片未變更，就讓它播完，避免刷新瞬間跳圖。
        function syncAfterDataRefresh() {
            var eligible = getEligibleBanners();
            var courseAllowed = enableCourses && isCourseTimeActive();
            if (currentDisplayMode === 'banner') {
                for (var i = 0; i < eligible.length; i++) {
                    if (eligible[i].item.url === currentBannerUrl) {
                        currentBannerIndex = i;
                        currentBannerSourceIndex = eligible[i].sourceIndex;
                        return;
                    }
                }
                if (eligible.length) { currentBannerIndex = 0; renderBannerLoop(); }
                else routeDisplay();
                return;
            }
            if (!courseAllowed && eligible.length) routeDisplay();
            else renderBoard();
        }

        // 兩個模組都關閉時，依既定需求保留課表作為預設版型。
        function routeDisplay() {
            stopMainTimer();
            var eligible = getEligibleBanners();
            var courseAllowed = enableCourses && isCourseTimeActive();
            if (!courseAllowed && eligible.length > 0) { currentBannerIndex = 0; renderBannerLoop(); return; }
            renderBoard();
        }

        function renderBoard() {
            stopMainTimer();
            currentDisplayMode = 'board';
            var eligible = getEligibleBanners();
            var courseAllowed = enableCourses && isCourseTimeActive();
            if (!courseAllowed && eligible.length > 0) { renderBannerLoop(); return; }
            var dayCourses = currentSchedule[activeDay] || [];
            var totalPages = Math.ceil(dayCourses.length / 4) || 1;
            var cardContainer = document.getElementById('cardContainer');
            var bannerContainer = document.getElementById('bannerContainer');
            if (currentPage >= totalPages) {
                currentPage = 0;
                if (eligible.length > 0) { renderBannerLoop(); return; }
            }
            bannerContainer.style.display = 'none';
            cardContainer.style.display = 'flex';
            applyHeaderVisibility(showHeader);
            var pageBadge = document.getElementById('pageBadge');
            if (totalPages > 1) {
                pageBadge.style.display = 'flex';
                document.getElementById('pageText').innerText = '頁次 ' + (currentPage + 1) + ' / ' + totalPages;
            } else { pageBadge.style.display = 'none'; }
            var pageCourses = dayCourses.slice(currentPage * 4, (currentPage + 1) * 4);
            for (var i = 0; i < 4; i++) {
                var item = pageCourses[i], card = document.getElementById('card-' + i);
                if (item) {
                    card.style.visibility = 'visible'; card.style.display = 'flex'; card.style.animation = 'none'; card.offsetHeight;
                    card.style.animation = 'cardFadeIn 0.5s ease forwards'; card.style.animationDelay = (i * 0.07) + 's';
                    document.getElementById('time-' + i).innerText = (item.startTime || '00:00') + ' - ' + (item.endTime || '00:00');
                    document.getElementById('name-' + i).innerText = item.name || '未命名課程';
                    document.getElementById('teacher-' + i).innerText = item.teacher || '未指定';
                    document.getElementById('room-' + i).innerText = item.room || '未指定教室';
                    var statusObj = evaluateCourseStatus(item.startTime, item.endTime), statusElem = document.getElementById('status-' + i);
                    statusElem.innerText = statusObj.text; statusElem.className = 'status-pill ' + statusObj.class;
                } else { card.style.visibility = 'hidden'; card.style.display = 'none'; }
            }
            mainTimer = setTimeout(function() { currentPage++; renderBoard(); }, carouselIntervalSec * 1000);
        }

        function renderBannerLoop() {
            stopMainTimer();
            var eligible = getEligibleBanners();
            if (!eligible.length) { currentPage = 0; renderBoard(); return; }
            currentDisplayMode = 'banner';
            var courseAllowed = enableCourses && isCourseTimeActive();
            if (currentBannerIndex >= eligible.length) {
                currentBannerIndex = 0;
                if (courseAllowed) { currentPage = 0; renderBoard(); return; }
            }
            var cardContainer = document.getElementById('cardContainer');
            var bannerContainer = document.getElementById('bannerContainer');
            cardContainer.style.display = 'none'; bannerContainer.style.display = 'block'; applyHeaderVisibility(false);
            var item = eligible[currentBannerIndex].item;
            currentBannerSourceIndex = eligible[currentBannerIndex].sourceIndex;
            currentBannerUrl = item.url;
            document.getElementById('bannerImg').src = item.url;
            var duration = item.duration || bannerIntervalSec;
            mainTimer = setTimeout(function() { currentBannerIndex++; renderBannerLoop(); }, duration * 1000);
        }

        function checkDisplayRules() {
            var today = new Date().getDay();
            if (today !== lastRealDay) {
                if (activeDay === lastRealDay) activeDay = today;
                lastRealDay = today;
                renderDaySelector();
                currentPage = 0;
                if (currentDisplayMode === 'board') routeDisplay();
            }
            var eligible = getEligibleBanners();
            var courseAllowed = enableCourses && isCourseTimeActive();
            if (currentDisplayMode === 'banner') {
                var currentStillEligible = false;
                for (var i = 0; i < eligible.length; i++) {
                    if (eligible[i].sourceIndex === currentBannerSourceIndex) currentStillEligible = true;
                }
                if (!eligible.length) {
                    currentBannerIndex = 0;
                    routeDisplay();
                } else if (!currentStillEligible) {
                    currentBannerIndex = 0;
                    renderBannerLoop();
                } else {
                    // 若有其他圖片剛進入可播放時段，重新對齊目前圖片在可播放清單中的位置。
                    for (var j = 0; j < eligible.length; j++) {
                        if (eligible[j].sourceIndex === currentBannerSourceIndex) currentBannerIndex = j;
                    }
                }
            } else if (!courseAllowed && eligible.length > 0) {
                currentBannerIndex = 0;
                routeDisplay();
            }
        }

        function stopMainTimer() {
            if (mainTimer !== null) { clearTimeout(mainTimer); clearInterval(mainTimer); mainTimer = null; }
        }

        function nextPage() {
            stopMainTimer();
            var dayCourses = currentSchedule[activeDay] || [], totalPages = Math.ceil(dayCourses.length / 4) || 1;
            currentPage = (currentPage + 1) % totalPages; renderBoard();
        }

        function prevPage() {
            stopMainTimer();
            var dayCourses = currentSchedule[activeDay] || [], totalPages = Math.ceil(dayCourses.length / 4) || 1;
            currentPage = (currentPage - 1 + totalPages) % totalPages; renderBoard();
        }

        function updateSignageScale() {
            var wrapper = document.getElementById('scaleWrapper');
            var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 730);
            wrapper.style.transform = 'scale(' + scale + ')';
        }

        window.onload = function() {
            renderDaySelector();
            updateSignageScale();
            updateTopClock();
            fetchAllData();
            setInterval(updateTopClock, 1000);
            setInterval(fetchAllData, 300000);
            ruleCheckTimer = setInterval(checkDisplayRules, 1000);
        };

        window.onresize = updateSignageScale;
    </script>
</body>
</html>
