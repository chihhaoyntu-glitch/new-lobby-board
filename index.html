<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程教室公告看板 (進階時段與精細排程版)</title>
    <style>
        /* --- 基礎鎖定與重置 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background-color: #dceefc;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.45) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.45) 2px, transparent 2px);
            background-size: 36px 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 1080x730 外框與等比縮放 --- */
        .signage-scale-wrapper {
            width: 1080px;
            height: 730px;
            position: relative;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
        }

        .signage-container {
            width: 1080px;
            height: 730px;
            margin: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            position: relative;
        }

        /* --- 頂部 Header --- */
        .header-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border: 3.5px solid #334155;
            border-radius: 20px;
            padding: 10px 16px;
            margin-bottom: 8px;
            box-shadow: 0px 6px 0px rgba(51, 65, 85, 0.15), 0px 12px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .header-bar.is-hidden {
            display: none !important;
        }

        .header-row1 {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-badge {
            background-color: #ffe885;
            border: 2.5px solid #334155;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0px 3px 0px rgba(0, 0, 0, 0.12);
        }

        .board-title {
            font-size: 24px;
            font-weight: 900;
            color: #1e293b;
            letter-spacing: 1px;
        }

        .clock-container {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
            padding-left: 12px;
            border-left: 2px solid #cbd5e1;
            font-size: 14px;
            font-weight: 800;
            color: #1e1b4b;
            background-color: #e0e7ff;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid #c7d2fe;
        }

        .header-row2 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 4px;
            border-top: 1px solid #e2e8f0;
        }

        .day-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
        }

        .day-btn {
            border: none;
            background: transparent;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 900;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .day-btn.active {
            background-color: #4f46e5;
            color: #ffffff;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.1);
        }

        .day-btn.today {
            background-color: #fef3c7;
            color: #78350f;
            border: 1px solid #fde68a;
        }

        .today-badge {
            font-size: 10px;
            background-color: #fbbf24;
            color: #0f172a;
            padding: 1px 4px;
            border-radius: 4px;
        }

        .page-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #fef3c7;
            border: 2.5px solid #fbbf24;
            color: #78350f;
            font-weight: 900;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .page-btn {
            background: transparent;
            border: none;
            font-weight: 900;
            color: #78350f;
            cursor: pointer;
            padding: 0 4px;
        }

        /* --- 4 個卡片欄位 (水彩風格) --- */
        .card-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: auto 0;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .watercolor-card {
            position: relative;
            border: 3.5px solid #334155;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            box-shadow: 0px 6px 0px rgba(51, 65, 85, 0.15), 0px 10px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            height: 110px;
            animation: cardFadeIn 0.5s ease forwards;
            transition: height 0.3s ease, padding 0.3s ease;
        }

        .card-container.expand-mode .watercolor-card {
            height: 132px;
            padding: 14px 24px;
        }

        .card-container.expand-mode .time-text { font-size: 26px; }
        .card-container.expand-mode .course-name { font-size: 30px; }
        .card-container.expand-mode .teacher-name { font-size: 20px; }
        .card-container.expand-mode .room-badge { font-size: 26px; padding: 10px 22px; }

        .watercolor-card:nth-child(1) { animation-delay: 0.05s; }
        .watercolor-card:nth-child(2) { animation-delay: 0.12s; }
        .watercolor-card:nth-child(3) { animation-delay: 0.19s; }
        .watercolor-card:nth-child(4) { animation-delay: 0.26s; }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-cardMint { background-color: #a2e3c4; }
        .bg-cardBlue { background-color: #b3e0ff; }
        .bg-cardYellow { background-color: #ffe885; }
        .bg-cardRed { background-color: #ff9e9e; }

        .time-box {
            width: 180px;
            background: rgba(255, 255, 255, 0.92);
            border: 2.5px solid #334155;
            border-radius: 14px;
            padding: 6px 0;
            text-align: center;
            flex-shrink: 0;
        }

        .time-text {
            font-size: 22px;
            font-weight: 900;
            color: #0f172a;
            display: block;
        }

        .status-pill {
            display: inline-block;
            margin-top: 2px;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 900;
            background-color: #e2e8f0;
            color: #334155;
        }

        .status-live {
            background-color: #10b981;
            color: #ffffff;
            animation: pulse-live 1.8s infinite ease-in-out;
        }

        @keyframes pulse-live {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }

        .info-box {
            flex: 1;
            margin-left: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 0;
        }

        .course-details {
            flex: 1;
            min-width: 0;
            margin-right: 16px;
        }

        .course-name {
            font-size: 26px;
            font-weight: 900;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .teacher-name {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-size: 17px;
            font-weight: 800;
            color: #334155;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .room-badge {
            background-color: #1e293b;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 12px;
            border: 2.5px solid #334155;
            font-size: 22px;
            font-weight: 900;
            box-shadow: 0px 4px 0px rgba(0, 0, 0, 0.12);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* --- 招生圖片輪播容器 --- */
        .banner-display-container {
            width: 100%;
            flex: 1;
            display: none;
            border: 3.5px solid #334155;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background-color: #ffffff;
            box-shadow: 0px 6px 0px rgba(51, 65, 85, 0.15);
            margin: auto 0;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- 跑馬燈公告 --- */
        .footer-bar {
            width: 100%;
            background-color: #fef3c7;
            border: 2.5px solid #334155;
            border-radius: 14px;
            padding: 8px 16px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0px 3px 0px rgba(0, 0, 0, 0.08);
            flex-shrink: 0;
        }

        .marquee-label {
            background-color: #fbbf24;
            color: #1e293b;
            font-size: 13px;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 8px;
            border: 1.5px solid #334155;
            flex-shrink: 0;
        }

        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            flex: 1;
        }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            font-size: 18px;
            font-weight: 900;
            color: #1e293b;
            animation: marquee-anim 20s linear infinite;
        }

        @keyframes marquee-anim {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <div id="scaleWrapper" class="signage-scale-wrapper">
        <div class="signage-container">

            <!-- HEADER BAR -->
            <header id="mainHeader" class="header-bar">
                <div class="header-row1">
                    <div class="header-title-box">
                        <div class="icon-badge">📢</div>
                        <h1 id="boardTitle" class="board-title">課程教室公告</h1>
                        <div id="topClockContainer" class="clock-container">
                            <span>⏰</span>
                            <span id="topClockText">加載中...</span>
                        </div>
                    </div>
                </div>

                <div class="header-row2">
                    <div id="daySelector" class="day-selector"></div>

                    <div id="pageBadge" class="page-badge" style="display: none;">
                        <button onclick="prevPage()" class="page-btn">◀</button>
                        <span id="pageText">頁次 1 / 1</span>
                        <button onclick="nextPage()" class="page-btn">▶</button>
                    </div>
                </div>
            </header>

            <!-- MAIN DISPLAY: 4 CARDS (課表區塊) -->
            <main id="cardContainer" class="card-container">
                <div id="card-0" class="watercolor-card bg-cardMint">
                    <div class="time-box">
                        <span id="time-0" class="time-text">00:00 - 00:00</span>
                        <span id="status-0" class="status-pill">計算中</span>
                    </div>
                    <div class="info-box">
                        <div class="course-details">
                            <div id="name-0" class="course-name">--</div>
                            <div class="teacher-name"><span>👤</span><span id="teacher-0">--</span></div>
                        </div>
                        <div class="room-badge">🏫 <span id="room-0">--</span></div>
                    </div>
                </div>

                <div id="card-1" class="watercolor-card bg-cardBlue">
                    <div class="time-box">
                        <span id="time-1" class="time-text">00:00 - 00:00</span>
                        <span id="status-1" class="status-pill">計算中</span>
                    </div>
                    <div class="info-box">
                        <div class="course-details">
                            <div id="name-1" class="course-name">--</div>
                            <div class="teacher-name"><span>👤</span><span id="teacher-1">--</span></div>
                        </div>
                        <div class="room-badge">🏫 <span id="room-1">--</span></div>
                    </div>
                </div>

                <div id="card-2" class="watercolor-card bg-cardYellow">
                    <div class="time-box">
                        <span id="time-2" class="time-text">00:00 - 00:00</span>
                        <span id="status-2" class="status-pill">計算中</span>
                    </div>
                    <div class="info-box">
                        <div class="course-details">
                            <div id="name-2" class="course-name">--</div>
                            <div class="teacher-name"><span>👤</span><span id="teacher-2">--</span></div>
                        </div>
                        <div class="room-badge">🏫 <span id="room-2">--</span></div>
                    </div>
                </div>

                <div id="card-3" class="watercolor-card bg-cardRed">
                    <div class="time-box">
                        <span id="time-3" class="time-text">00:00 - 00:00</span>
                        <span id="status-3" class="status-pill">計算中</span>
                    </div>
                    <div class="info-box">
                        <div class="course-details">
                            <div id="name-3" class="course-name">--</div>
                            <div class="teacher-name"><span>👤</span><span id="teacher-3">--</span></div>
                        </div>
                        <div class="room-badge">🏫 <span id="room-3">--</span></div>
                    </div>
                </div>
            </main>

            <!-- BANNERS DISPLAY (招生圖片輪播區塊) -->
            <div id="bannerContainer" class="banner-display-container">
                <img id="bannerImg" class="banner-img" src="" alt="招生海報">
            </div>

            <!-- FOOTER MARQUEE -->
            <footer class="footer-bar">
                <span class="marquee-label">📢 公告</span>
                <div class="marquee-container">
                    <div id="marqueeText" class="marquee-track">載入中，請稍候...</div>
                </div>
            </footer>

        </div>
    </div>

    <!-- APP LOGIC -->
    <script>
        const COURSES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkOoAr-xdQSYp8U6yyedy5uUypUlQVQiPSiVzLd8lAEmfQacXXY2g8hNEjcmeObgxRcguKX7xsr34V/pub?gid=0&single=true&output=csv";
        const CONFIG_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkOoAr-xdQSYp8U6yyedy5uUypUlQVQiPSiVzLd8lAEmfQacXXY2g8hNEjcmeObgxRcguKX7xsr34V/pub?gid=962273106&single=true&output=csv";
        const BANNERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkOoAr-xdQSYp8U6yyedy5uUypUlQVQiPSiVzLd8lAEmfQacXXY2g8hNEjcmeObgxRcguKX7xsr34V/pub?gid=1617619420&single=true&output=csv";

        const DAYS = [
            { id: 1, name: '一' }, { id: 2, name: '二' }, { id: 3, name: '三' },
            { id: 4, name: '四' }, { id: 5, name: '五' }, { id: 6, name: '六' }, { id: 0, name: '日' }
        ];

        let currentSchedule = { 0:[], 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] };
        let rawBannerList = []; 
        let currentBannerIndex = 0;
        
        let activeDay = new Date().getDay();
        let currentPage = 0;
        let mainTimer = null;
        
        // --- 全局與模組控制變數 ---
        let boardTitle = "課程教室公告";
        let marqueeText = "歡迎蒞臨！請全程佩戴口罩並保持社交距離。";
        let carouselIntervalSec = 8;
        let bannerIntervalSec = 10;
        let showHeader = true;

        // 總開關與時段設定預設值
        let enableCourses = true;
        let courseStartTime = "16:00";
        let courseEndTime = "22:00";

        let enableBanners = true;
        let bannerStartTime = "07:00";
        let bannerEndTime = "18:00";

        function parseCSV(text) {
            var lines = text.split('\n');
            var result = [];
            if (lines.length < 2) return result;
            var headers = lines[0].replace(/\r/g, '').split(',');
            for (var i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                var values = lines[i].replace(/\r/g, '').split(',');
                var obj = {};
                for (var j = 0; j < headers.length; j++) {
                    var key = headers[j].trim().replace(/^"|"$/g, '');
                    var val = values[j] ? values[j].trim().replace(/^"|"$/g, '') : '';
                    obj[key] = val;
                }
                result.push(obj);
            }
            return result;
        }

        function applyHeaderVisibility(visible) {
            var headerElem = document.getElementById('mainHeader');
            var cardContainer = document.getElementById('cardContainer');
            if (visible) {
                headerElem.classList.remove('is-hidden');
                cardContainer.classList.remove('expand-mode');
            } else {
                headerElem.classList.add('is-hidden');
                cardContainer.classList.add('expand-mode');
            }
        }

        function convertDriveUrl(url) {
            if (!url) return '';
            var match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return 'https://drive.google.com/uc?export=view&id=' + match[1];
            }
            return url;
        }

        // --- 時段與日期判斷工具函式 ---
        function parseMinutes(timeStr) {
            if (!timeStr || timeStr.indexOf(':') === -1) return -1;
            var parts = timeStr.split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        function isCurrentTimeInWindow(startStr, endStr) {
            var startMins = parseMinutes(startStr);
            var endMins = parseMinutes(endStr);
            if (startMins === -1 || endMins === -1) return true; // 未設定即代表全天允許

            var now = new Date();
            var currentMins = now.getHours() * 60 + now.getMinutes();

            if (startMins <= endMins) {
                return currentMins >= startMins && currentMins < endMins;
            } else {
                // 跨夜時段處理 (例如 22:00 - 06:00)
                return currentMins >= startMins || currentMins < endMins;
            }
        }

        // 檢查單張 Banner 圖片是否符合當前時間/日期/星期條件
        function isBannerActive(banner) {
            var now = new Date();

            // 1. 日期區間檢查 (YYYY-MM-DD)
            var todayStr = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0');

            if (banner.startDate && todayStr < banner.startDate) return false;
            if (banner.endDate && todayStr > banner.endDate) return false;

            // 2. 星期檢查 (例如 "1,2,3,4,5" 或 "0,6")
            if (banner.daysOfWeek && banner.daysOfWeek.trim() !== '') {
                var currentDay = String(now.getDay());
                var allowedDays = banner.daysOfWeek.split(',').map(function(d) { return d.trim(); });
                if (allowedDays.indexOf(currentDay) === -1) return false;
            }

            // 3. 當日時間區間檢查 (HH:MM)
            if (!isCurrentTimeInWindow(banner.startTime, banner.endTime)) return false;

            return true;
        }

        function getActiveBanners() {
            return rawBannerList.filter(isBannerActive);
        }

        function fetchAllData() {
            // 1. 抓取 Config 參數 (含總開關與時段)
            if (CONFIG_CSV_URL && CONFIG_CSV_URL.indexOf("YOUR_CONFIG") === -1) {
                var xhrConfig = new XMLHttpRequest();
                xhrConfig.open('GET', CONFIG_CSV_URL, true);
                xhrConfig.onreadystatechange = function() {
                    if (xhrConfig.readyState === 4 && xhrConfig.status === 200) {
                        var configData = parseCSV(xhrConfig.responseText);
                        for (var i = 0; i < configData.length; i++) {
                            var row = configData[i];
                            var k = row.Key;
                            var v = row.Value;

                            if (k === 'boardTitle') boardTitle = v;
                            if (k === 'marqueeText') marqueeText = v;
                            if (k === 'carouselIntervalSec') carouselIntervalSec = parseInt(v) || 8;
                            if (k === 'bannerIntervalSec') bannerIntervalSec = parseInt(v) || 10;
                            if (k === 'showHeader') showHeader = String(v).toLowerCase() !== 'false';

                            // 總開關與時段設定
                            if (k === 'enableCourses') enableCourses = String(v).toLowerCase() !== 'false';
                            if (k === 'courseStartTime') courseStartTime = v || "16:00";
                            if (k === 'courseEndTime') courseEndTime = v || "22:00";

                            if (k === 'enableBanners') enableBanners = String(v).toLowerCase() !== 'false';
                            if (k === 'bannerStartTime') bannerStartTime = v || "07:00";
                            if (k === 'bannerEndTime') bannerEndTime = v || "18:00";
                        }
                        document.getElementById('boardTitle').innerText = boardTitle;
                        document.getElementById('marqueeText').innerText = marqueeText;
                        applyHeaderVisibility(showHeader);
                    }
                };
                xhrConfig.send();
            }

            // 2. 抓取 Banners 圖片清單 (含細粒度排程屬性)
            if (BANNERS_CSV_URL && BANNERS_CSV_URL.indexOf("YOUR_BANNERS") === -1) {
                var xhrBanners = new XMLHttpRequest();
                xhrBanners.open('GET', BANNERS_CSV_URL, true);
                xhrBanners.onreadystatechange = function() {
                    if (xhrBanners.readyState === 4 && xhrBanners.status === 200) {
                        var bannersData = parseCSV(xhrBanners.responseText);
                        var newBanners = [];
                        for (var i = 0; i < bannersData.length; i++) {
                            var item = bannersData[i];
                            if (item.ImageUrl && item.ImageUrl.trim() !== '') {
                                newBanners.push({
                                    url: convertDriveUrl(item.ImageUrl.trim()),
                                    duration: parseInt(item.DurationSec) || bannerIntervalSec,
                                    startDate: item.StartDate || '',
                                    endDate: item.EndDate || '',
                                    startTime: item.StartTime || '',
                                    endTime: item.EndTime || '',
                                    daysOfWeek: item.DaysOfWeek || ''
                                });
                            }
                        }
                        rawBannerList = newBanners;
                    }
                };
                xhrBanners.send();
            }

            // 3. 抓取 Courses 課表
            if (COURSES_CSV_URL && COURSES_CSV_URL.indexOf("YOUR_COURSES") === -1) {
                var xhrCourses = new XMLHttpRequest();
                xhrCourses.open('GET', COURSES_CSV_URL, true);
                xhrCourses.onreadystatechange = function() {
                    if (xhrCourses.readyState === 4 && xhrCourses.status === 200) {
                        var coursesData = parseCSV(xhrCourses.responseText);
                        var newSchedule = { 0:[], 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] };
                        for (var i = 0; i < coursesData.length; i++) {
                            var item = coursesData[i];
                            var day = parseInt(item.Day);
                            if (!isNaN(day) && newSchedule[day]) {
                                newSchedule[day].push({
                                    startTime: item.StartTime,
                                    endTime: item.EndTime,
                                    name: item.Name,
                                    teacher: item.Teacher,
                                    room: item.Room
                                });
                            }
                        }
                        currentSchedule = newSchedule;
                        startMasterControl();
                        renderDaySelector();
                    }
                };
                xhrCourses.send();
            }
        }

        function evaluateCourseStatus(startStr, endStr) {
            if (!startStr || !endStr) return { text: '未開始', class: '' };
            var now = new Date();
            var currentMins = now.getHours() * 60 + now.getMinutes();
            var startMins = parseMinutes(startStr);
            var endMins = parseMinutes(endStr);

            if (currentMins >= startMins && currentMins <= endMins) {
                return { text: '● 進行中', class: 'status-live' };
            } else if (currentMins < startMins && (startMins - currentMins) <= 30) {
                return { text: '即將開始', class: '' };
            } else if (currentMins < startMins) {
                return { text: '未開始', class: '' };
            } else {
                return { text: '已結束', class: '' };
            }
        }

        function updateTopClock() {
            var now = new Date();
            var year = now.getFullYear();
            var month = (now.getMonth() + 1 < 10 ? '0' : '') + (now.getMonth() + 1);
            var date = (now.getDate() < 10 ? '0' : '') + now.getDate();
            var dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            var dayStr = dayNames[now.getDay()];
            var hours = (now.getHours() < 10 ? '0' : '') + now.getHours();
            var mins = (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
            var secs = (now.getSeconds() < 10 ? '0' : '') + now.getSeconds();

            document.getElementById('topClockText').innerText = year + '/' + month + '/' + date + ' (' + dayStr + ') ' + hours + ':' + mins + ':' + secs;
        }

        function renderDaySelector() {
            var container = document.getElementById('daySelector');
            container.innerHTML = '';
            var realToday = new Date().getDay();

            DAYS.forEach(function(day) {
                var isSelected = activeDay === day.id;
                var isToday = realToday === day.id;

                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'day-btn' + (isSelected ? ' active' : '') + (isToday && !isSelected ? ' today' : '');
                
                var dayLabel = '週' + day.name;
                if (isToday) dayLabel += ' <span class="today-badge">今日</span>';

                btn.innerHTML = dayLabel;
                btn.onclick = function() {
                    activeDay = day.id;
                    currentPage = 0;
                    currentBannerIndex = 0;
                    renderDaySelector();
                    startMasterControl();
                };
                container.appendChild(btn);
            });
        }

        // --- 核心控制入口：判定目前該切換到課表還是圖片 ---
        function startMasterControl() {
            stopMainTimer();

            var courseActive = enableCourses && isCurrentTimeInWindow(courseStartTime, courseEndTime);
            var activeBanners = getActiveBanners();
            var bannerActive = enableBanners && isCurrentTimeInWindow(bannerStartTime, bannerEndTime) && (activeBanners.length > 0);

            // 當前的交替策略：預設先嘗試呈現課表；若課表時段未到或被總開關關閉，則直奔圖片
            if (courseActive) {
                renderBoard();
            } else if (bannerActive) {
                renderBannerLoop();
            } else {
                // 兩者皆非（或皆關閉），預設顯示課表備用
                renderBoard();
            }
        }

        // 課表呈現邏輯
        function renderBoard() {
            stopMainTimer();
            var activeBanners = getActiveBanners();
            var courseActive = enableCourses && isCurrentTimeInWindow(courseStartTime, courseEndTime);
            var bannerActive = enableBanners && isCurrentTimeInWindow(bannerStartTime, bannerEndTime) && (activeBanners.length > 0);

            var dayCourses = currentSchedule[activeDay] || [];
            var totalPages = Math.ceil(dayCourses.length / 4) || 1;

            var cardContainer = document.getElementById('cardContainer');
            var bannerContainer = document.getElementById('bannerContainer');

            // 如果課表已經播完一輪（頁碼超出）
            if (currentPage >= totalPages) {
                currentPage = 0;
                // 如果此時圖片模組處於允許狀態，順暢切換去播圖片！
                if (bannerActive) {
                    renderBannerLoop();
                    return;
                }
            }

            // 若課表被關閉且圖片可用，跳轉去圖片
            if (!courseActive && bannerActive) {
                renderBannerLoop();
                return;
            }

            bannerContainer.style.display = 'none';
            cardContainer.style.display = 'flex';
            applyHeaderVisibility(showHeader);

            var pageBadge = document.getElementById('pageBadge');
            if (totalPages > 1) {
                pageBadge.style.display = 'flex';
                document.getElementById('pageText').innerText = '頁次 ' + (currentPage + 1) + ' / ' + totalPages;
            } else {
                pageBadge.style.display = 'none';
            }

            var pageCourses = dayCourses.slice(currentPage * 4, (currentPage + 1) * 4);

            for (var i = 0; i < 4; i++) {
                var item = pageCourses[i];
                var card = document.getElementById('card-' + i);

                if (item) {
                    card.style.visibility = 'visible';
                    card.style.display = 'flex';
                    card.style.animation = 'none';
                    card.offsetHeight;
                    card.style.animation = 'cardFadeIn 0.5s ease forwards';
                    card.style.animationDelay = (i * 0.07) + 's';

                    document.getElementById('time-' + i).innerText = (item.startTime || '00:00') + ' - ' + (item.endTime || '00:00');
                    document.getElementById('name-' + i).innerText = item.name || '未命名課程';
                    document.getElementById('teacher-' + i).innerText = item.teacher || '未指定';
                    document.getElementById('room-' + i).innerText = item.room || '未指定教室';

                    var statusObj = evaluateCourseStatus(item.startTime, item.endTime);
                    var statusElem = document.getElementById('status-' + i);
                    statusElem.innerText = statusObj.text;
                    statusElem.className = 'status-pill ' + statusObj.class;
                } else {
                    card.style.visibility = 'hidden';
                    card.style.display = 'none';
                }
            }

            mainTimer = setTimeout(function() {
                currentPage++;
                renderBoard();
            }, carouselIntervalSec * 1000);
        }

        // 圖片輪播邏輯
        function renderBannerLoop() {
            stopMainTimer();
            var activeBanners = getActiveBanners();
            var courseActive = enableCourses && isCurrentTimeInWindow(courseStartTime, courseEndTime);
            var bannerActive = enableBanners && isCurrentTimeInWindow(bannerStartTime, bannerEndTime) && (activeBanners.length > 0);

            var cardContainer = document.getElementById('cardContainer');
            var bannerContainer = document.getElementById('bannerContainer');

            // 如果沒有合格可播放的圖片，或圖片模組被關閉 ➔ 自動切回課表
            if (!bannerActive || activeBanners.length === 0) {
                currentPage = 0;
                renderBoard();
                return;
            }

            // 圖片已播完一輪
            if (currentBannerIndex >= activeBanners.length) {
                currentBannerIndex = 0;
                // 如果課表此時處於允許狀態 ➔ 切回課表；否則繼續圖片循環
                if (courseActive) {
                    currentPage = 0;
                    renderBoard();
                    return;
                }
            }

            cardContainer.style.display = 'none';
            bannerContainer.style.display = 'block';
            applyHeaderVisibility(false);

            var item = activeBanners[currentBannerIndex];
            document.getElementById('bannerImg').src = item.url;

            mainTimer = setTimeout(function() {
                currentBannerIndex++;
                renderBannerLoop();
            }, item.duration * 1000);
        }

        function stopMainTimer() {
            if (mainTimer !== null) {
                clearTimeout(mainTimer);
                clearInterval(mainTimer);
                mainTimer = null;
            }
        }

        function nextPage() {
            stopMainTimer();
            var dayCourses = currentSchedule[activeDay] || [];
            var totalPages = Math.ceil(dayCourses.length / 4) || 1;
            currentPage = (currentPage + 1) % totalPages;
            renderBoard();
        }

        function prevPage() {
            stopMainTimer();
            var dayCourses = currentSchedule[activeDay] || [];
            var totalPages = Math.ceil(dayCourses.length / 4) || 1;
            currentPage = (currentPage - 1 + totalPages) % totalPages;
            renderBoard();
        }

        function updateSignageScale() {
            var wrapper = document.getElementById('scaleWrapper');
            var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 730);
            wrapper.style.transform = 'scale(' + scale + ')';
        }

        window.onload = function() {
            renderDaySelector();
            updateSignageScale();
            fetchAllData();
            setInterval(updateTopClock, 1000);
            setInterval(fetchAllData, 300000);
        };

        window.onresize = updateSignageScale;
    </script>
</body>
</html>
